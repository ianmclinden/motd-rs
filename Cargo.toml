[package]
name = "motd"
description = "Message of the Day utility"
authors = ["Ian McLinden <mclinden.ian@gmail.com>"]
version = "0.2.5"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
clap = { workspace = true }
futures = "0.3.31"
tokio = { version = "1.47.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
] }
walkdir = "2.5.0"

[workspace]
members = ["tools/macOS"]

[workspace.dependencies]
clap = { version = "4.5.48", features = ["cargo", "derive"] }
