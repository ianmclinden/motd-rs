[package]
name = "motd"
description = "Message of the Day utility"
authors = ["Ian McLinden <mclinden.ian@gmail.com>"]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
members = ["tools/macOS"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.5.48", features = ["cargo", "derive"] }
futures = "0.3.31"
tokio = { version = "1.47.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
] }

[dependencies]
clap.workspace = true
futures.workspace = true
tokio.workspace = true
walkdir = "2.5.0"
